name: Generate a set

on:
  # アプリの「作成」タブから届く生成リクエスト。
  # ラベル付きで Issue を作ると opened と labeled が両方発火するため labeled だけを見る。
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      topic:
        description: 'テーマ (空ならネタ帳から自動で選ぶ)'
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  # 生成は data/ に push するので、同時に走らせない。
  group: generate

jobs:
  generate:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'generate' &&
       github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY が空です。Settings → Secrets and variables → Actions の" \
                 "「Repository secrets」に GEMINI_API_KEY という名前で登録してください" \
                 "(Environments / Dependabot / Codespaces のタブではありません)。"
            exit 1
          fi
          echo "GEMINI_API_KEY: ${#GEMINI_API_KEY} 文字"

      - name: Read requested topic
        id: topic
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            node scripts/parse-generate-request.mjs > topic.txt
          else
            printf '%s' "${{ inputs.topic }}" > topic.txt
          fi
          echo "topic=$(cat topic.txt)" >> "$GITHUB_OUTPUT"

      - name: Generate with Gemini
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # テーマは自由入力なのでシェルには渡さず環境変数で受け渡す。
          TOPIC_TEXT="$(cat topic.txt)" node scripts/generate-day.mjs > set-id.txt
          echo "set_id=$(cat set-id.txt)" >> "$GITHUB_OUTPUT"

      - name: Test and commit
        run: |
          node --test "test/*.test.mjs"
          node scripts/validate.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git commit -m "問題追加: ${{ steps.generate.outputs.set_id }}"
          git push

      - name: Report on the issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SET_ID: ${{ steps.generate.outputs.set_id }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "問題ができました: \`$SET_ID\` — アプリを開いたままなら自動で表示されます。"
          gh issue close ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} --reason completed

      - name: Report failure
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "作成に失敗しました。[実行ログ](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) を確認してください。"
