name: Daily problem set

on:
  schedule:
    # 21:00 UTC = 06:00 JST。学習者が起きる前に当日分をコミットしておく。
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '生成する日付 (YYYY-MM-DD, 空なら今日 JST)'
        required: false
      topic:
        description: 'トピック id を指定 (空ならランダム)'
        required: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY が空です。Settings → Secrets and variables → Actions の" \
                 "「Repository secrets」に GEMINI_API_KEY という名前で登録してください" \
                 "(Environments / Dependabot / Codespaces のタブではありません)。"
            exit 1
          fi
          echo "GEMINI_API_KEY: ${#GEMINI_API_KEY} 文字"

      - name: Generate with Gemini
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          [ -n "${{ inputs.date }}" ] && ARGS="$ARGS --date=${{ inputs.date }}"
          [ -n "${{ inputs.topic }}" ] && ARGS="$ARGS --topic=${{ inputs.topic }}"
          echo "date=$(node scripts/new-day.mjs $ARGS --print-date)" >> "$GITHUB_OUTPUT"

          set +e
          node scripts/generate-day.mjs $ARGS
          code=$?
          set -e
          # 終了コード 2 = その日は生成済み。失敗ではなくスキップ扱いにする。
          if [ $code -eq 2 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ $code -ne 0 ]; then
            exit $code
          fi

      - name: Test and commit
        if: steps.generate.outputs.skip != 'true'
        run: |
          node --test "test/*.test.mjs"
          node scripts/validate.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --staged --quiet || git commit -m "問題追加: ${{ steps.generate.outputs.date }}"
          git push
