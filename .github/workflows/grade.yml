name: Grade submission

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

jobs:
  grade:
    # ラベル "grade" が付いた、所有者自身の Issue だけを採点対象にする
    # (API の無料枠を他人に消費されないように)。
    if: >
      contains(github.event.issue.labels.*.name, 'grade') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY が空です。Settings → Secrets and variables → Actions の" \
                 "「Repository secrets」に GEMINI_API_KEY という名前で登録してください" \
                 "(Environments / Dependabot / Codespaces のタブではありません)。"
            exit 1
          fi
          echo "GEMINI_API_KEY: ${#GEMINI_API_KEY} 文字"

      - name: Grade with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: node scripts/grade.mjs > feedback.md

      - name: Post feedback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '\n\n---\n_Gemini による自動採点_\n' >> feedback.md
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} --body-file feedback.md

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "採点に失敗しました。[実行ログ](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) を確認してください。"
