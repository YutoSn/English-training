name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# アップロード (upload) と配信 (deploy) を別のジョブに分ける。同じジョブで続けて
# 実行すると、アップロード直後に deploy-pages が成果物を見つけられず
# 「No artifacts named "github-pages" were found」で落ちることがあった
# (GitHub 側の反映待ち)。ジョブを分ければ、その間に反映が済む。
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ビルド不要の静的サイト。リポジトリ全体をそのまま配信する
      # (index.html / web/ / data/ がすべて必要)。
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: upload
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
