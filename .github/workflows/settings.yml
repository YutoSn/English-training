name: Apply settings

on:
  issues:
    # labeled だけを見る。ラベル付きで Issue を作ると opened と labeled の
    # 両方が発火するため、両方を拾うと同じ処理が二重に走る。
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  # 同じ Issue に対する実行を直列化する (data/ への push が競合しないように)。
  group: settings-${{ github.event.issue.number }}

jobs:
  apply:
    # data/*.json を書き換えるので、ラベルに加えて発行者もリポジトリ所有者に限る。
    # (ラベル付けには元々 write 権限が要るが、二重に絞っておく)
    if: >
      github.event.label.name == 'settings' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply
        id: apply
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/apply-settings.mjs > result.md

      - name: Commit and report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/validate.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/config.json data/topics.json
          if git diff --staged --quiet; then
            echo '(ファイルに変更はありませんでした)' >> result.md
          else
            git commit -m "設定変更: #${{ github.event.issue.number }}"
            git push
          fi
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} --body-file result.md
          gh issue close ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} --reason completed

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo ${{ github.repository }} \
            --body "設定の反映に失敗しました。[実行ログ](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) を確認してください。"
